name: Build XoXe APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Verify public assets
        run: |
          echo "=== public folder ==="
          ls -la public/ || echo "no public"
          echo "=== dist/models ==="
          ls -la dist/models/ || echo "no dist/models"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Add Capacitor Android
        run: npx cap add android
      - name: Install SVG tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate app icons
        run: |
          set -e
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p /tmp/icons
          for size in 48 72 96 144 192; do
            rsvg-convert -w $size -h $size public/icon.svg -o /tmp/icons/ic_$size.png
          done
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${d%%:*}"
            size="${d##*:}"
            cp /tmp/icons/ic_$size.png android/app/src/main/res/mipmap-$name/ic_launcher.png
            cp /tmp/icons/ic_$size.png android/app/src/main/res/mipmap-$name/ic_launcher_round.png
          done
          ls -la android/app/src/main/res/mipmap-hdpi/
      - name: Force landscape orientation
        run: |
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="landscape"|' android/app/src/main/AndroidManifest.xml
      - name: Immersive fullscreen MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/xoxe/game
          cat > android/app/src/main/java/com/xoxe/game/MainActivity.java << 'EOF'
          package com.xoxe.game;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XoXe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
